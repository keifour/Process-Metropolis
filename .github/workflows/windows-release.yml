name: Windows desktop release
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Record build start
        env:
          BUILD_STATUS: installing
        run: node scripts/release-report.mjs
      - name: Install locked dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          npm ci 2>&1 | Tee-Object artifacts/install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows telemetry and termination guards
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          npm test 2>&1 | Tee-Object artifacts/tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate desktop before packaging
        shell: pwsh
        run: |
          node scripts/smoke-desktop.mjs --report artifacts/smoke-source.json 2>&1 | Tee-Object artifacts/smoke-source.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record build progress
        env:
          BUILD_STATUS: building
        run: node scripts/release-report.mjs
      - name: Build portable Windows x64 executable
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run dist:win 2>&1 | Tee-Object artifacts/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record smoke test progress
        env:
          BUILD_STATUS: validating
        run: node scripts/release-report.mjs
      - name: Run packaged desktop and portable executable
        shell: pwsh
        run: |
          node scripts/smoke-desktop.mjs --exe "dist/win-unpacked/Process Metropolis.exe" --report artifacts/smoke-desktop.json 2>&1 | Tee-Object artifacts/smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem dist -Filter '*-windows-x64.exe' | Select-Object -First 1
          if (!$exe) { throw 'Portable executable is missing' }
          node scripts/smoke-desktop.mjs --exe $exe.FullName --report artifacts/smoke-portable.json 2>&1 | Tee-Object -Append artifacts/smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Publish verified Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version"
          if ($tag -ne "v$version") { throw 'Tag and package version must match' }
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --draft --title "Process Metropolis $tag · Windows 桌面版" --notes-file RELEASE_NOTES.md 2>&1 | Tee-Object artifacts/publish.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $exe = Get-ChildItem dist -Filter '*-windows-x64.exe' | Select-Object -First 1
          gh release upload $tag $exe.FullName artifacts/SHA256SUMS.txt artifacts/smoke-desktop.json artifacts/smoke-portable.json --clobber 2>&1 | Tee-Object -Append artifacts/publish.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest 2>&1 | Tee-Object -Append artifacts/publish.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release view $tag --json tagName,url,isDraft,assets | Set-Content artifacts/release.json -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-${{ github.ref_name }}
          path: |
            dist/*-windows-x64.exe
            artifacts/
          if-no-files-found: warn
      - name: Save build receipt
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
        run: node scripts/release-report.mjs
